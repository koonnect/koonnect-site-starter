name: CMS Validate

on:
  push:
    branches:
      - main
      - 'ai-edit/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    # Dormant on the starter repo (clone target) — active on every
    # scaffolded tenant. Same gate as cloudflare-pages.yml.
    if: github.repository != 'koonnect/koonnect-site-starter'
    # Same NODE_AUTH_TOKEN wiring as cloudflare-pages.yml — pnpm needs
    # it the moment any @koonnect/* package is added to dependencies.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.KOONNECT_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cms:validate
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
