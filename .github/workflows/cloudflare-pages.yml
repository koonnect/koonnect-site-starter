name: Cloudflare Pages Deploy

on:
  push:
    branches:
      - main
      - 'ai-edit/**'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm cms:validate
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: e1b688909b80cbac11c69e744cbc3ccf
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm dlx wrangler@latest pages deploy out \
            --project-name koortex-site \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${{ github.event.head_commit.message || 'Manual deploy' }}"
