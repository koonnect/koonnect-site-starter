name: Cloudflare Pages Deploy

on:
  push:
    branches:
      - main
      - 'ai-edit/**'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The starter is a clone target for `koonnect new-site` — it has no
    # production deploy of its own. This guard keeps the workflow dormant
    # in `koonnect/koonnect-site-starter` (no red badges from missing
    # secrets) and active in every scaffolded tenant repo.
    if: github.repository != 'koonnect/koonnect-site-starter'
    # NODE_AUTH_TOKEN authenticates pnpm against GitHub Packages for the
    # `@koonnect/*` scope (see .npmrc). Required when the tenant pulls
    # @koonnect/cms-core or any other Koonnect package — pre-wired in the
    # starter so adding a Koonnect dep "just works" on the next push.
    # Repo secret: KOONNECT_PACKAGES_TOKEN (PAT with read:packages).
    env:
      NODE_AUTH_TOKEN: ${{ secrets.KOONNECT_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm cms:validate
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: e1b688909b80cbac11c69e744cbc3ccf
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # `__TENANT_PAGES_PROJECT__` is a marker swapped by the
          # `koonnect new-site` CLI for the tenant's CF Pages project
          # name (convention: <slug>-site). Astro emits `dist/`, not
          # `out/` (the old marker referenced a Next.js dir).
          pnpm dlx wrangler@latest pages deploy dist \
            --project-name __TENANT_PAGES_PROJECT__ \
            --branch "${GITHUB_REF_NAME}" \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "${{ github.event.head_commit.message || 'Manual deploy' }}"
