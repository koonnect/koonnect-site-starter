<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--koon-bg);color:var(--koon-fg);font-family:var(--koon-font);}
.wrap{display:flex;align-items:center;gap:32px;}
.mark{width:140px;height:140px;background:url(assets/logo-mark.png) center/contain no-repeat;flex-shrink:0;}
.meta{display:flex;flex-direction:column;gap:6px;}
.brand{font-size:28px;font-weight:700;letter-spacing:.06em;color:#fff;}
.tag{font-size:14px;color:rgb(199,199,199);}
.tag b{color:#0093FC;font-weight:500;}
</style></head><body class="koon">
<div class="wrap">
  <div class="mark"></div>
  <div class="meta">
    <div class="brand">KOONNECT</div>
    <div class="tag">Software E-Commerce</div>
    <div class="tag" style="margin-top:6px">Pinwheel · gold · navy · pink · grey — four rotated discs intersecting at center</div>
    <div class="tag"><b>Primary use:</b> always pair with full wordmark unless at favicon sizes.</div>
  </div>
</div>
</body></html>
