<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--koon-bg);color:var(--koon-fg);font-family:var(--koon-font);}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.chip{padding:3px 14px;border-radius:16px;font-size:11px;letter-spacing:.04em;color:#fff;font-family:var(--koon-font);}
.chip-blue{background:#0093FC;}
.chip-dark{background:#333;color:#0093FC;}
.chip-gold{background:#FCC000;color:#202020;}
.arrow{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;}
.arrow-grad{background:linear-gradient(180deg,#FCC000,#0093FC);}
.arrow-blue{background:#0093FC;}
.arrow-dark{background:#202020;}
.arrow svg{width:14px;height:14px;}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--koon-fg-muted);width:100%;margin-top:6px;}
</style></head><body class="koon">
<div class="row">
  <span class="chip chip-blue">ARTIGOS</span>
  <span class="chip chip-dark">NOTÍCIAS</span>
  <span class="chip chip-gold">NOVO</span>
  <span class="arrow arrow-grad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
  <span class="arrow arrow-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
  <span class="arrow arrow-dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
</div>
<div class="lbl">Badge chips · Arrow chips — signature "continue" affordance</div>
</body></html>
