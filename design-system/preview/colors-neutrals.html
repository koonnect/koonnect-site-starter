<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--koon-bg);color:var(--koon-fg);font-family:var(--koon-font);}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .swatch{border-radius:12px;flex:1;min-width:0;}
  .sw{height:80px;border-radius:12px;border:1px solid var(--koon-border-hair);}
  .lbl{padding:6px 2px 0;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--koon-fg-muted);}
  .val{font-size:11px;color:var(--koon-fg);}
</style></head><body class="koon">
<div class="row">
  <div class="swatch"><div class="sw" style="background:rgb(15,15,15)"></div><div class="lbl">BG Deep</div><div class="val">#0F0F0F</div></div>
  <div class="swatch"><div class="sw" style="background:rgb(32,32,32)"></div><div class="lbl">BG</div><div class="val">#202020</div></div>
  <div class="swatch"><div class="sw" style="background:rgb(51,51,51)"></div><div class="lbl">BG Raised</div><div class="val">#333333</div></div>
  <div class="swatch"><div class="sw" style="background:rgb(62,67,71)"></div><div class="lbl">Border Soft</div><div class="val">#3E4347</div></div>
  <div class="swatch"><div class="sw" style="background:rgb(130,130,130)"></div><div class="lbl">FG Subtle</div><div class="val">#828282</div></div>
  <div class="swatch"><div class="sw" style="background:rgb(199,199,199)"></div><div class="lbl">FG Muted</div><div class="val">#C7C7C7</div></div>
  <div class="swatch"><div class="sw" style="background:rgb(255,255,255)"></div><div class="lbl">FG</div><div class="val">#FFFFFF</div></div>
</div>
</body></html>
