<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--koon-bg);color:var(--koon-fg);font-family:var(--koon-font);}
.row{display:flex;gap:24px;flex-wrap:wrap;}
.tok{display:flex;flex-direction:column;gap:8px;flex:1;min-width:140px;}
.b{background:var(--koon-bg-raised);height:80px;border-radius:15px;}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--koon-fg-muted);}
</style></head><body class="koon">
<div class="row">
  <div class="tok"><div class="b" style="box-shadow:0 0 15px rgba(0,0,0,.10)"></div><div class="lbl">SM · header float<br>0 0 15 rgba(0,0,0,.10)</div></div>
  <div class="tok"><div class="b" style="box-shadow:0 10px 16px rgba(0,0,0,.50)"></div><div class="lbl">MD · dropped menu<br>0 10 16 rgba(0,0,0,.50)</div></div>
  <div class="tok"><div class="b" style="box-shadow:0 0 20px #000"></div><div class="lbl">LG · raised form<br>0 0 20 #000</div></div>
  <div class="tok"><div class="b" style="box-shadow:0 0 15px #202020"></div><div class="lbl">GLOW · card focus<br>0 0 15 #202020</div></div>
</div>
</body></html>
