<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--koon-bg);color:var(--koon-fg);font-family:var(--koon-font);}
.hdr{height:80px;background:#333;box-shadow:0 0 15px rgba(0,0,0,.10);display:flex;align-items:center;padding:0 40px;gap:32px;border-radius:8px;}
.logo{width:44px;height:40px;background:url(assets/logo-mark.png) center/contain no-repeat;}
.brand{font-size:15px;font-weight:700;letter-spacing:.04em;color:#fff;}
.nav{display:flex;gap:22px;margin-left:auto;font-size:13px;color:#fff;align-items:center;}
.nav span{opacity:.95;cursor:pointer;}
.flag{width:18px;height:14px;background:linear-gradient(90deg,#699635 30%,#ED4C5C 30%);border-radius:2px;}
.pt{display:flex;align-items:center;gap:6px;border:1px solid rgb(199,199,199);color:rgb(199,199,199);padding:6px 12px;border-radius:18px;font-size:12px;}
.cta{background:#0093FC;color:#fff;padding:8px 18px;border-radius:18px;font-size:14px;border:none;}
</style></head><body class="koon">
<div class="hdr">
  <div class="logo"></div>
  <div class="brand">KOONNECT</div>
  <div class="nav">
    <span>Soluções ▾</span><span>Plataforma ▾</span><span>Casos de Sucesso</span><span>Parceiros</span><span>Preços</span><span>Blog</span>
    <span class="pt"><span class="flag"></span>PT ▾</span>
    <button class="cta">Agendar Demo</button>
  </div>
</div>
</body></html>
