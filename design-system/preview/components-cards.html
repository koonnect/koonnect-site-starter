<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--koon-bg);color:var(--koon-fg);font-family:var(--koon-font);}
.row{display:flex;gap:16px;}
.card{flex:1;min-width:0;border-radius:15px;overflow:hidden;position:relative;background:#333;min-height:200px;padding:14px;display:flex;flex-direction:column;justify-content:flex-end;}
.outline{border:2px solid #333;background:transparent;}
.filled{background:#333;box-shadow:0 0 20px #000;}
.media{background:url(assets/news-thumb-1.jpg) center/cover;}
.media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.6));}
.media > *{position:relative;z-index:1;}
.eyebrow{font-size:11px;color:#0093FC;letter-spacing:.04em;text-transform:uppercase;}
.title{font-size:16px;font-weight:700;color:#0093FC;margin-top:8px;}
.sub{font-size:12px;color:rgb(199,199,199);margin-top:4px;}
.lbl{position:absolute;top:12px;left:12px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:rgb(199,199,199);z-index:2;}
</style></head><body class="koon">
<div class="row">
  <div class="card outline"><div class="lbl">Outline</div><div class="eyebrow">2px · #333</div><div class="title">Feature tile</div><div class="sub">transparent · radius 15</div></div>
  <div class="card filled"><div class="lbl">Filled</div><div class="eyebrow">fill #333</div><div class="title">CTA panel</div><div class="sub">shadow 0 0 20 #000</div></div>
  <div class="card media"><div class="lbl" style="color:#fff">Media</div><div class="eyebrow">overlay 0.5</div><div class="title" style="color:#fff">Photo card</div><div class="sub" style="color:#fff">radius 15 + linear overlay</div></div>
</div>
</body></html>
