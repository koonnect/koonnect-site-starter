<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--koon-bg);color:var(--koon-fg);font-family:var(--koon-font);}
.news{width:320px;background:#333;border-radius:10px;padding:14px;position:relative;}
.news img{width:100%;height:160px;object-fit:cover;border-radius:15px;display:block;}
.news .chip{display:inline-block;margin-top:14px;padding:3px 14px;border-radius:16px;background:#0093FC;color:#fff;font-size:11px;letter-spacing:.04em;}
.news h4{font-size:16px;font-weight:700;color:#0093FC;margin:10px 0 6px;line-height:18px;}
.news p{font-size:14px;line-height:16px;color:#fff;margin:0;}
.arrow{position:absolute;top:24px;right:24px;width:25px;height:25px;border-radius:50%;background:linear-gradient(180deg,#0093FC,#272991);display:flex;align-items:center;justify-content:center;}
.arrow svg{width:12px;height:12px;color:#fff;}
</style></head><body class="koon">
<div class="news">
  <img src="assets/news-thumb-1.jpg" alt="">
  <span class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M7 17L17 7M9 7h8v8"/></svg></span>
  <span class="chip">ARTIGOS</span>
  <h4>Como criar uma loja online</h4>
  <p>Ter uma loja online poderá ser sinónimo de conquistar novos clientes, aumentar o volume de negócios (…)</p>
</div>
</body></html>
