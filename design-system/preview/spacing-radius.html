<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--koon-bg);color:var(--koon-fg);font-family:var(--koon-font);}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;}
.tok{display:flex;flex-direction:column;align-items:center;gap:8px;}
.b{background:var(--koon-bg-raised);width:72px;height:52px;border:2px solid var(--koon-border);}
.lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--koon-fg-muted);text-align:center;}
</style></head><body class="koon">
<div class="row">
  <div class="tok"><div class="b" style="border-radius:2px"></div><div class="lbl">XS · 2px<br>checkbox</div></div>
  <div class="tok"><div class="b" style="border-radius:10px"></div><div class="lbl">SM · 10px<br>compact card</div></div>
  <div class="tok"><div class="b" style="border-radius:15px"></div><div class="lbl">MD · 15px<br>primary card</div></div>
  <div class="tok"><div class="b" style="border-radius:18px;width:100px"></div><div class="lbl">Pill · 18px<br>buttons / chips</div></div>
  <div class="tok"><div class="b" style="border-radius:9999px;width:52px"></div><div class="lbl">Full<br>arrow chips</div></div>
</div>
</body></html>
