<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--koon-bg);color:var(--koon-fg);font-family:var(--koon-font);}
  .row{display:flex;gap:16px;flex-wrap:wrap;}
  .sem{flex:1;min-width:0;border-radius:12px;padding:12px 14px;color:#fff;font-size:13px;}
  .sem b{display:block;font-weight:600;margin-bottom:4px;}
  .sem small{opacity:.8;font-size:11px;}
</style></head><body class="koon">
<div class="row">
  <div class="sem" style="background:rgb(0,147,252)"><b>Info · Link</b><small>#0093FC · primary CTA, headings emphasis</small></div>
  <div class="sem" style="background:rgb(252,192,0);color:#202020"><b>Warning · Highlight</b><small>#FCC000 · gradient top, rare solo use</small></div>
  <div class="sem" style="background:rgb(105,150,53)"><b>Success</b><small>#699635</small></div>
  <div class="sem" style="background:rgb(237,76,92)"><b>Error</b><small>#ED4C5C</small></div>
</div>
</body></html>
