<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--koon-bg);color:var(--koon-fg);font-family:var(--koon-font);}
.feat{width:240px;border:2px solid #333;border-radius:10px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;}
.ico{width:40px;height:40px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:#202020;}
.ico svg{width:22px;height:22px;}
.feat h5{font-size:16px;font-weight:600;color:#fff;margin:4px 0 0;}
.feat p{font-size:14px;line-height:1.35;color:rgb(199,199,199);margin:0;}
.cta{width:100%;height:35px;border-radius:18px;background:#0093FC;color:#fff;font-size:14px;border:none;margin-top:6px;cursor:pointer;font-family:var(--koon-font);}
</style></head><body class="koon">
<div class="feat">
  <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h10M4 17h16"/></svg></div>
  <h5>Criação</h5>
  <p>Desenvolvemos soluções inovadoras e funcionais para o teu negócio.</p>
  <button class="cta">Saber mais</button>
</div>
</body></html>
