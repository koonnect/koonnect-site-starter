<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--koon-bg);color:var(--koon-fg);font-family:var(--koon-font);}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.tok{display:flex;flex-direction:column;gap:6px;align-items:center;}
.box{background:var(--koon-bg-raised);border-radius:4px;}
.lbl{font-size:10px;color:var(--koon-fg-muted);letter-spacing:.06em;text-transform:uppercase;}
</style></head><body class="koon">
<div class="row">
  <div class="tok"><div class="box" style="width:4px;height:28px"></div><div class="lbl">4 · sp-1</div></div>
  <div class="tok"><div class="box" style="width:8px;height:28px"></div><div class="lbl">8 · sp-2</div></div>
  <div class="tok"><div class="box" style="width:12px;height:28px"></div><div class="lbl">12 · sp-3</div></div>
  <div class="tok"><div class="box" style="width:16px;height:28px"></div><div class="lbl">16 · sp-4</div></div>
  <div class="tok"><div class="box" style="width:20px;height:28px"></div><div class="lbl">20 · sp-5</div></div>
  <div class="tok"><div class="box" style="width:24px;height:28px"></div><div class="lbl">24 · sp-6</div></div>
  <div class="tok"><div class="box" style="width:32px;height:28px"></div><div class="lbl">32 · sp-8</div></div>
  <div class="tok"><div class="box" style="width:40px;height:28px"></div><div class="lbl">40 · sp-10</div></div>
  <div class="tok"><div class="box" style="width:48px;height:28px"></div><div class="lbl">48 · sp-12</div></div>
  <div class="tok"><div class="box" style="width:64px;height:28px"></div><div class="lbl">64 · sp-16</div></div>
  <div class="tok"><div class="box" style="width:80px;height:28px"></div><div class="lbl">80 · sp-20</div></div>
</div>
<div style="font-size:11px;color:var(--koon-fg-muted);letter-spacing:.04em">4-point grid · container padding 140px @ 1440</div>
</body></html>
