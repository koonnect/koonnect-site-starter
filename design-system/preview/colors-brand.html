<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;padding:0;background:var(--koon-bg);color:var(--koon-fg);font-family:var(--koon-font);}
  body{padding:24px;}
  .card{background:var(--koon-bg);padding:0;}
  .row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
  .swatch{border-radius:12px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-width:0;}
  .swatch .sw{height:80px;border-radius:12px;}
  .swatch .lbl{padding:6px 2px 0;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--koon-fg-muted);}
  .swatch .val{font-size:11px;color:var(--koon-fg);font-variant-numeric:tabular-nums;}
  .stack{display:flex;flex-direction:column;gap:4px;}
</style></head><body class="koon">
<div class="card">
  <div class="row">
    <div class="swatch"><div class="sw" style="background:rgb(0,147,252)"></div><div class="stack"><div class="lbl">Koonnect Blue</div><div class="val">#0093FC</div></div></div>
    <div class="swatch"><div class="sw" style="background:rgb(39,41,145)"></div><div class="stack"><div class="lbl">Blue Deep</div><div class="val">#272991</div></div></div>
    <div class="swatch"><div class="sw" style="background:rgb(0,113,188)"></div><div class="stack"><div class="lbl">Blue Press</div><div class="val">#0071BC</div></div></div>
    <div class="swatch"><div class="sw" style="background:rgb(252,192,0)"></div><div class="stack"><div class="lbl">Gold</div><div class="val">#FCC000</div></div></div>
    <div class="swatch"><div class="sw" style="background:rgb(255,230,46)"></div><div class="stack"><div class="lbl">Gold Bright</div><div class="val">#FFE62E</div></div></div>
    <div class="swatch"><div class="sw" style="background:rgb(215,36,180)"></div><div class="stack"><div class="lbl">Magenta</div><div class="val">#D724B4</div></div></div>
  </div>
</div>
</body></html>
