<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--koon-bg);color:var(--koon-fg);font-family:var(--koon-font);}
.stack{display:flex;flex-direction:column;gap:12px;max-width:640px;}
.pill{display:flex;align-items:center;gap:10px;height:35px;padding:0 16px;border-radius:18px;background:#333;color:rgb(199,199,199);font-size:14px;}
.glass{display:flex;align-items:center;gap:10px;height:50px;padding:0 18px;border-radius:25px;background:rgba(255,255,255,.05);backdrop-filter:blur(16px);color:#fff;font-size:18px;opacity:.9;border:1px solid rgba(255,255,255,.08);}
.glass .dot{width:18px;height:18px;border-radius:4px;background:#FCC000;}
.check{display:flex;align-items:center;gap:10px;font-size:12px;color:rgb(199,199,199);}
.check .box{width:15px;height:15px;border:1px solid rgb(216,216,231);border-radius:2px;}
</style></head><body class="koon">
<div class="stack">
  <div class="glass"><span class="dot"></span> Como podemos ajudar?</div>
  <div class="pill">Nome</div>
  <div class="pill">Email</div>
  <div class="check"><div class="box"></div> Consinto que Koonnect trate e utilize os meus dados pessoais.</div>
</div>
</body></html>
