<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<title>Koonnect — Marketing Site Kit</title>
<style>
/* =========================================================
   KOONNECT DESIGN SYSTEM — Colors & Type
   Source: Koonnect'25 dark-mode marketing site (Figma)
   Brand: E-commerce & AI-enablement platform · Portuguese
   ========================================================= */

/* Self-hosted Poppins — full family (thin 100 … black 900, upright + italic) */
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-Thin.ttf') format('truetype');        font-weight: 100; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-ThinItalic.ttf') format('truetype');  font-weight: 100; font-style: italic; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-ExtraLight.ttf') format('truetype');  font-weight: 200; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-ExtraLightItalic.ttf') format('truetype'); font-weight: 200; font-style: italic; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-Light.ttf') format('truetype');       font-weight: 300; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-LightItalic.ttf') format('truetype'); font-weight: 300; font-style: italic; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-Regular.ttf') format('truetype');     font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-Italic.ttf') format('truetype');      font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-Medium.ttf') format('truetype');      font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-MediumItalic.ttf') format('truetype'); font-weight: 500; font-style: italic; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-SemiBold.ttf') format('truetype');    font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-SemiBoldItalic.ttf') format('truetype'); font-weight: 600; font-style: italic; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-Bold.ttf') format('truetype');        font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-BoldItalic.ttf') format('truetype');  font-weight: 700; font-style: italic; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-ExtraBold.ttf') format('truetype');   font-weight: 800; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-ExtraBoldItalic.ttf') format('truetype'); font-weight: 800; font-style: italic; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-Black.ttf') format('truetype');       font-weight: 900; font-style: normal; font-display: swap; }
@font-face { font-family: 'Poppins'; src: url('fonts/Poppins-BlackItalic.ttf') format('truetype'); font-weight: 900; font-style: italic; font-display: swap; }

:root {
  /* --- BRAND COLORS --- */
  --koon-blue:        rgb(0, 147, 252);   /* Primary blue — links, CTAs, accents */
  --koon-blue-deep:   rgb(39, 41, 145);   /* Deep navy — gradient bottom, logo */
  --koon-blue-press:  rgb(0, 113, 188);   /* Pressed/darker blue */
  --koon-gold:        rgb(252, 192, 0);   /* Primary gold — highlights, secondary CTA */
  --koon-gold-bright: rgb(255, 230, 46);  /* Bright yellow — accents (logo, flag) */
  --koon-magenta:     rgb(215, 36, 180);  /* Magenta (logo variant) */

  /* Signature gradient — appears on highlight fills + pill CTAs */
  --koon-gradient:       linear-gradient(180deg, var(--koon-gold) 0%, var(--koon-blue) 100%);
  --koon-gradient-text:  linear-gradient(180deg, var(--koon-gold) 0%, var(--koon-blue) 100%);
  --koon-gradient-blue:  linear-gradient(180deg, var(--koon-blue) 0%, var(--koon-blue-deep) 100%);

  /* --- NEUTRALS (DARK MODE — default) --- */
  --koon-bg:          rgb(32, 32, 32);    /* Page background */
  --koon-bg-raised:   rgb(51, 51, 51);    /* Cards, headers, footer */
  --koon-bg-deep:     rgb(15, 15, 15);    /* Extra-dark pockets */
  --koon-surface:     rgba(255, 255, 255, 0.05); /* Glass search pill, overlays */

  --koon-border:      rgb(51, 51, 51);    /* 2px outline cards */
  --koon-border-soft: rgb(62, 67, 71);    /* Subtle dividers */
  --koon-border-hair: rgba(216, 216, 231, 0.3);

  --koon-fg:          rgb(255, 255, 255); /* Primary text on dark */
  --koon-fg-muted:    rgb(199, 199, 199); /* Secondary text, placeholders */
  --koon-fg-subtle:   rgb(130, 130, 130);
  --koon-fg-inverse:  rgb(32, 32, 32);    /* Text on white cards */

  /* --- SEMANTIC --- */
  --koon-success:     rgb(105, 150, 53);
  --koon-error:       rgb(237, 76, 92);
  --koon-info:        var(--koon-blue);
  --koon-warning:     var(--koon-gold);

  /* --- SHADOWS --- */
  --koon-shadow-sm:   0 0 15px rgba(0, 0, 0, 0.10);
  --koon-shadow-md:   0 10px 16px rgba(0, 0, 0, 0.50);
  --koon-shadow-lg:   0 0 20px rgb(0, 0, 0);
  --koon-shadow-glow: 0 0 15px rgb(32, 32, 32);

  /* --- RADII --- */
  --koon-r-xs:  2px;   /* checkboxes */
  --koon-r-sm:  10px;  /* secondary cards */
  --koon-r-md:  15px;  /* primary cards, images */
  --koon-r-pill: 18px; /* buttons, chips, search */
  --koon-r-full: 9999px;

  /* --- SPACING (4-point scale) --- */
  --koon-sp-1: 4px;
  --koon-sp-2: 8px;
  --koon-sp-3: 12px;
  --koon-sp-4: 16px;
  --koon-sp-5: 20px;
  --koon-sp-6: 24px;
  --koon-sp-8: 32px;
  --koon-sp-10: 40px;
  --koon-sp-12: 48px;
  --koon-sp-16: 64px;
  --koon-sp-20: 80px;     /* header height */
  --koon-sp-container: 140px; /* page side padding on 1440 */

  /* --- TYPE --- */
  --koon-font:        'Poppins', -apple-system, 'Segoe UI', Roboto, sans-serif;

  --koon-h1-size: 48px;   --koon-h1-weight: 800;   --koon-h1-lh: 1.05;
  --koon-h2-size: 44px;   --koon-h2-weight: 400;   --koon-h2-lh: 1.25;
  --koon-h3-size: 36px;   --koon-h3-weight: 400;   --koon-h3-lh: 1.4;
  --koon-h4-size: 30px;   --koon-h4-weight: 700;   --koon-h4-lh: 1.15;
  --koon-h5-size: 24px;   --koon-h5-weight: 500;   --koon-h5-lh: 1.3;
  --koon-h6-size: 21px;   --koon-h6-weight: 500;   --koon-h6-lh: 1.2;

  --koon-body-lg-size: 18px;  --koon-body-lg-lh: 1.5;
  --koon-body-size:    16px;  --koon-body-lh:    1.5;
  --koon-body-sm-size: 14px;  --koon-body-sm-lh: 1.35;
  --koon-caption-size: 12px;  --koon-caption-lh: 1.4;
  --koon-micro-size:   11px;  --koon-micro-lh:   1.0;
  --koon-micro-tracking: 0.04em;

  /* --- MOTION --- */
  --koon-ease:   cubic-bezier(.2, .8, .2, 1);
  --koon-dur:    180ms;
  --koon-dur-lg: 320ms;
}

/* =========================================================
   Semantic element defaults — use inside .koon scope
   ========================================================= */

.koon,
.koon * {
  box-sizing: border-box;
}

.koon {
  background: var(--koon-bg);
  color: var(--koon-fg);
  font-family: var(--koon-font);
  font-size: var(--koon-body-size);
  line-height: var(--koon-body-lh);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.koon h1, .koon .h1 { font-size: var(--koon-h1-size); font-weight: var(--koon-h1-weight); line-height: var(--koon-h1-lh); margin: 0; }
.koon h2, .koon .h2 { font-size: var(--koon-h2-size); font-weight: var(--koon-h2-weight); line-height: var(--koon-h2-lh); margin: 0; }
.koon h3, .koon .h3 { font-size: var(--koon-h3-size); font-weight: var(--koon-h3-weight); line-height: var(--koon-h3-lh); margin: 0; }
.koon h4, .koon .h4 { font-size: var(--koon-h4-size); font-weight: var(--koon-h4-weight); line-height: var(--koon-h4-lh); margin: 0; }
.koon h5, .koon .h5 { font-size: var(--koon-h5-size); font-weight: var(--koon-h5-weight); line-height: var(--koon-h5-lh); margin: 0; }
.koon h6, .koon .h6 { font-size: var(--koon-h6-size); font-weight: var(--koon-h6-weight); line-height: var(--koon-h6-lh); margin: 0; }

.koon p, .koon .p  { font-size: var(--koon-body-size); line-height: var(--koon-body-lh); margin: 0; color: var(--koon-fg); }
.koon .p-muted     { color: var(--koon-fg-muted); }
.koon .body-lg     { font-size: var(--koon-body-lg-size); line-height: var(--koon-body-lg-lh); }
.koon .body-sm     { font-size: var(--koon-body-sm-size); line-height: var(--koon-body-sm-lh); }
.koon .caption     { font-size: var(--koon-caption-size); line-height: var(--koon-caption-lh); color: var(--koon-fg-muted); }
.koon .eyebrow     { font-size: var(--koon-micro-size); letter-spacing: var(--koon-micro-tracking); text-transform: uppercase; color: var(--koon-blue); }

.koon a            { color: var(--koon-blue); text-decoration: none; transition: opacity var(--koon-dur) var(--koon-ease); }
.koon a:hover      { opacity: 0.75; }

/* Gradient text — used on key hero words */
.koon .gradient-text {
  background: var(--koon-gradient);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  display: inline-block;
}

/* Koonnect marketing-site kit — extends colors_and_type.css */
body { margin: 0; background: var(--koon-bg); color: var(--koon-fg); font-family: var(--koon-font); }
* { box-sizing: border-box; }

/* ——— Header ——— */
.k-header {
  position: sticky; top: 0; z-index: 50;
  height: 80px;
  background: rgb(51,51,51);
  box-shadow: 0 0 15px rgba(0,0,0,.10);
  display: flex; align-items: center;
  padding: 0 50px;
  gap: 40px;
}
.k-logo { width: 63px; height: 55px; background: url(assets/logo-mark.png) center/contain no-repeat; flex-shrink: 0; }
.k-nav { display: flex; gap: 26px; align-items: center; margin-left: 40px; font-size: 14px; color: #fff; }
.k-nav-item { display: flex; align-items: center; gap: 6px; cursor: pointer; opacity: .95; transition: opacity .2s; position: relative; padding: 8px 0; }
.k-nav-item:hover { opacity: .6; }
.k-nav-item .caret { width: 8px; height: 5px; background: currentColor; clip-path: polygon(0 0, 100% 0, 50% 100%); display: inline-block; }
.k-nav-cta { margin-left: auto; display: flex; gap: 12px; align-items: center; }
.k-nav-pt { display: flex; align-items: center; gap: 8px; padding: 7px 14px; border: 1px solid rgb(199,199,199); color: rgb(199,199,199); border-radius: 18px; font-size: 14px; }
.k-nav-pt .flag { width: 18px; height: 14px; border-radius: 50%; background: linear-gradient(90deg, rgb(105,150,53) 30%, rgb(237,76,92) 30%); position: relative; }
.k-nav-pt .flag::after { content: ""; position: absolute; left: 5px; top: 3px; width: 7px; height: 7px; background: rgb(255,230,46); border-radius: 50%; border: 1px solid rgb(237,76,92); }
.k-btn-demo { background: #0093FC; color: #fff; padding: 8px 22px; height: 35px; border: none; border-radius: 18px; font-size: 14px; cursor: pointer; font-family: var(--koon-font); }
.k-btn-demo:hover { filter: brightness(1.08); }

/* ——— Mega menu ——— */
.k-mega {
  position: absolute; top: 80px; left: 0; right: 0;
  background: rgb(51,51,51); box-shadow: 0 10px 16px rgba(0,0,0,.5);
  padding: 45px 140px; display: none; gap: 24px;
}
.k-mega.open { display: flex; }
.k-mega-col { flex: 1; }
.k-mega-card { background: #202020; border-radius: 15px; padding: 20px; height: 174px; display: flex; flex-direction: column; justify-content: space-between; }
.k-mega-title { color: #0093FC; font-size: 18px; font-weight: 500; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.k-mega-title .arrow { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(180deg,#FCC000,#0093FC); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.k-mega-title.gold { color: #FCC000; }
.k-mega-sub { color: rgb(199,199,199); font-size: 12px; line-height: 20px; margin-top: 10px; }
.k-mega-img { background: url(assets/ecommerce-photo.jpg) center/cover; border-radius: 15px; padding: 20px; height: 262px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; position: relative; }
.k-mega-img::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.35); border-radius: 15px; }
.k-mega-img > * { position: relative; z-index: 1; }

/* ——— Buttons ——— */
.k-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; cursor: pointer; font-family: var(--koon-font); font-weight: 400; line-height: 1; transition: filter .2s, opacity .2s; }
.k-btn-primary { background: #0093FC; color: #fff; padding: 0 28px; height: 45px; border-radius: 23px; font-size: 16px; }
.k-btn-primary:hover { filter: brightness(1.1); }
.k-btn-primary:active { filter: brightness(.92); }
.k-btn-outline { background: transparent; color: #fff; padding: 0 28px; height: 40px; border-radius: 20px; border: 1px solid #fff; font-size: 16px; }
.k-btn-gold { background: #FCC000; color: #fff; padding: 0 22px; height: 35px; border-radius: 18px; font-size: 16px; }
.k-btn-grad { background: linear-gradient(180deg,#0093FC,#272991); color: #fff; padding: 0 24px; height: 35px; border-radius: 18px; font-size: 14px; }

/* ——— Hero ——— */
.k-hero { position: relative; height: 580px; overflow: hidden; }
.k-hero-bg { position: absolute; inset: 0; background: url(assets/hero-bg-dark.jpg) center/cover; }
.k-hero-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, #202020 0%, rgba(98,98,98,0) 100%); }
.k-hero-inner { position: relative; max-width: 1160px; margin: 0 auto; padding: 200px 140px 0; text-align: center; }
.k-hero-title { font-size: 30px; font-weight: 700; line-height: 35px; color: #fff; max-width: 594px; margin: 0 auto; }
.k-hero-search { margin: 36px auto 0; max-width: 678px; height: 50px; border-radius: 25px; background: rgba(255,255,255,.05); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,.08); display: flex; align-items: center; padding: 0 22px; gap: 14px; }
.k-hero-search .dot { width: 20px; height: 20px; border-radius: 4px; background: #FCC000; flex-shrink: 0; }
.k-hero-search input { background: transparent; border: none; outline: none; flex: 1; color: #fff; font-size: 18px; font-family: var(--koon-font); opacity: .9; }
.k-hero-search input::placeholder { color: rgba(255,255,255,.5); }

/* ——— Solutions grid ——— */
.k-section { padding: 90px 140px; }
.k-section-title { font-size: 30px; font-weight: 400; line-height: 1.15; color: #0093FC; text-align: center; margin-bottom: 10px; }
.k-section-title .grad { background: linear-gradient(180deg,#FCC000,#0093FC); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
.k-section-sub { font-size: 14px; color: rgb(199,199,199); text-align: center; max-width: 560px; margin: 0 auto 40px; }
.k-pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 30px; }
.k-pillar { border: 2px solid #333; border-radius: 10px; padding: 26px 20px; text-align: center; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 14px; transition: border-color .2s, transform .2s; }
.k-pillar:hover { border-color: #0093FC; transform: translateY(-4px); }
.k-pillar-icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #fff; }
.k-pillar-icon svg { width: 40px; height: 40px; }
.k-pillar h4 { font-size: 18px; font-weight: 600; color: #fff; margin: 0; }
.k-pillar p { font-size: 14px; line-height: 1.35; color: rgb(199,199,199); margin: 0; flex: 1; }
.k-pillar .k-btn { width: 100%; margin-top: 8px; height: 35px; border-radius: 18px; font-size: 14px; }

/* ——— Panels & CTAs ——— */
.k-panel { background: #333; border-radius: 15px; padding: 60px; text-align: center; }
.k-panel h3 { font-size: 36px; font-weight: 400; color: #0093FC; line-height: 1.4; max-width: 620px; margin: 0 auto 30px; }
.k-panel h3 b { font-weight: 700; }

.k-banner { position: relative; margin: 80px 0; }
.k-banner-rails { position: relative; display: flex; justify-content: space-between; gap: 40px; align-items: center; }
.k-banner-img { width: 283px; height: 365px; background-size: cover; background-position: center; flex-shrink: 0; }
.k-banner-img.left { border-radius: 0 15px 15px 0; background-image: url(assets/ecommerce-photo.jpg); }
.k-banner-img.right { border-radius: 15px 0 0 15px; background-image: url(assets/hero-bg-dark.jpg); }
.k-banner-center { flex: 1; text-align: center; padding: 0 40px; }
.k-banner-center h2 { font-size: 30px; line-height: 1.1; color: #fff; font-weight: 400; margin: 0 0 18px; }
.k-banner-center h2 b { font-weight: 700; }
.k-banner-center p { font-size: 16px; line-height: 1.5; color: rgb(199,199,199); max-width: 560px; margin: 0 auto 24px; }

/* ——— Clients ——— */
.k-clients { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 30px; }
.k-clients .cell { border: 2px solid #333; border-radius: 15px; height: 103px; display: flex; align-items: center; justify-content: center; padding: 12px; }
.k-clients img { max-height: 60px; max-width: 140px; object-fit: contain; filter: brightness(0) invert(1); opacity: .9; }

/* ——— News cards ——— */
.k-news-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
.k-news { position: relative; background: transparent; border: 2px solid #333; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; cursor: pointer; transition: transform .2s, border-color .2s; }
.k-news:hover { transform: translateY(-4px); border-color: #0093FC; }
.k-news.selected { background: #333; border-color: #333; }
.k-news .thumb { border-radius: 15px; height: 209px; background-size: cover; background-position: center; }
.k-news .chip { display: inline-block; width: fit-content; padding: 3px 14px; border-radius: 16px; background: #0093FC; color: #fff; font-size: 11px; letter-spacing: .04em; }
.k-news.selected .chip { background: #0093FC; }
.k-news:not(.selected) .chip { background: #333; color: #0093FC; }
.k-news h4 { font-size: 16px; font-weight: 700; line-height: 18px; color: #0093FC; margin: 0; }
.k-news p { font-size: 14px; line-height: 16px; color: #fff; margin: 0; }
.k-news .arrow { position: absolute; top: 30px; right: 30px; width: 25px; height: 25px; border-radius: 50%; background: linear-gradient(180deg,#0093FC,#272991); display: flex; align-items: center; justify-content: center; }
.k-news.selected .arrow { background: #202020; }
.k-news .arrow svg { width: 12px; height: 12px; color: #fff; }

/* ——— Press ——— */
.k-press { background: #333; border-radius: 15px; padding: 50px 40px; margin-top: 40px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.k-press .cell { background: #fff; border-radius: 15px; height: 103px; display: flex; align-items: center; justify-content: center; padding: 12px; }
.k-press img { max-height: 70px; max-width: 140px; object-fit: contain; }

/* ——— Newsletter ——— */
.k-newsletter { text-align: center; padding: 0 140px 120px; }
.k-newsletter h3 { font-size: 30px; line-height: 1.1; color: #0093FC; font-weight: 400; margin: 0 auto 10px; max-width: 610px; }
.k-newsletter h3 .grad { background: linear-gradient(180deg,#FCC000,#0093FC); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 700; }
.k-newsletter-form { display: flex; align-items: center; gap: 0; background: #333; border-radius: 18px; padding: 0; max-width: 722px; margin: 30px auto 20px; height: 35px; padding-right: 0; overflow: hidden; }
.k-newsletter-form input { background: transparent; border: none; outline: none; flex: 1; padding: 0 20px; color: #fff; font-size: 14px; font-family: var(--koon-font); height: 100%; }
.k-newsletter-form input::placeholder { color: rgb(199,199,199); }
.k-newsletter-form .sep { width: 1px; height: 18px; background: #202020; }
.k-newsletter-form .k-btn-gold { border-radius: 0 18px 18px 0; height: 100%; font-size: 16px; }
.k-newsletter small { display: flex; align-items: flex-start; gap: 10px; max-width: 720px; margin: 0 auto; font-size: 11px; color: rgb(199,199,199); text-align: left; line-height: 1.5; }
.k-newsletter .check { width: 15px; height: 15px; border: 1px solid rgb(216,216,231); border-radius: 2px; flex-shrink: 0; margin-top: 2px; }
.k-newsletter .check.on { background: #0093FC; border-color: #0093FC; }

/* ——— Footer ——— */
.k-footer { background: #333; padding: 50px 140px 30px; }
.k-footer-top { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap: 40px; }
.k-foot-brand { display: flex; gap: 14px; align-items: flex-start; }

      <Newsletter onSubscribe={({ email, consent }) => showToast(consent && email ? `Subscrito: ${email}` : 'Preencha o email e aceite os termos')} />
      <Footer />
      {toast && <div className="k-toast show">{toast}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
